# docker compose up -d --build         -> the server (UI + /api/ingest + /mcp) on 127.0.0.1:8000
# No Mac for the pusher? deploy/macos-vm/ runs one in a container on any KVM host.
# Site-specific bits (reverse proxy labels, networks) go in a gitignored compose.override.yml —
# see compose.override.example.yml.
services:
  server:
    build: .
    restart: unless-stopped
    environment:
      MONEY_TOKEN: ${MONEY_TOKEN:?put MONEY_TOKEN in .env (openssl rand -hex 32)}
      # SMS times are Saudi local time and the weekly check uses "today"; POSIX form needs no tzdata
      TZ: "<+03>-3"
      # Optional OAuth for /mcp (claude.ai connectors): JWTs from this issuer with aud = client id
      MONEY_PUBLIC_URL: ${MONEY_PUBLIC_URL:-}
      MONEY_OIDC_ISSUER: ${MONEY_OIDC_ISSUER:-}
      MONEY_OIDC_CLIENT_ID: ${MONEY_OIDC_CLIENT_ID:-}
      # Optional: coach/coach.py on the host (the dashboard chat); see coach/money-coach-chat.service
      MONEY_CHAT_URL: ${MONEY_CHAT_URL:-}
    volumes:
      - ./data:/data  # personal.py, statements/*.csv, and everything the pipeline writes
    ports:
      - ${MONEY_PORT:-127.0.0.1:8000}:8000
